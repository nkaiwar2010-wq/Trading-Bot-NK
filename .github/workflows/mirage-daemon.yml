name: Mirage Intraday Daemon

on:
  # No schedule: trigger here on purpose -- GitHub Actions' own cron is
  # documented as best-effort with no SLA and was unreliable in practice
  # (fired 5.5 hours late on day 1, didn't fire at all on day 2). A Claude
  # Code cloud routine (reliable cron all session) triggers this via the
  # workflow_dispatch API instead -- see routines/mirage-trigger-daemon.md.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-daemon:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Mirage intraday daemon
        env:
          ALPACA_API_KEY: ${{ secrets.MIRAGE_ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.MIRAGE_ALPACA_SECRET_KEY }}
          ALPACA_ENDPOINT: https://paper-api.alpaca.markets/v2
          ALPACA_DATA_ENDPOINT: https://data.alpaca.markets/v2
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/mirage_daemon.py
